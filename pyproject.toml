
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seven"
version = "0.1.0a0"
description = "Seven Personal AI Companion"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "loguru>=0.7.3",
    "platformdirs>=4.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.1",
    "dependency-injector>=4.41",
    "httpx>=0.28",
    "PySide6>=6.8",
    "pywebview>=5.4",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.20",
    "openai>=1.0",
    "psutil>=6.0",
]

[project.scripts]
seven = "seven.app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.0",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
